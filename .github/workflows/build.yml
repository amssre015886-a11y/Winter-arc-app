
name: Build Winter Arc APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'winter-arc-project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project
        run: |
          mkdir project
          unzip winter-arc-project.zip -d project

      - name: Build APK
        run: gradle -p project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winter-Arc-APK
          path: project/app/build/outputs/apk/debug/*.apk
